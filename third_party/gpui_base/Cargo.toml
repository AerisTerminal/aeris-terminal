[package]
name = "gpui-base"
version = "0.5.2"
edition = "2024"
autobins = false
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
repository = "https://github.com/longbridge/gpui-kit"
homepage = "https://gpui-kit.com"
documentation = "https://docs.rs/gpui-base"
license-file = "LICENSE-APACHE"
publish = false

[package.metadata.aeris]
upstream-revision = "c0946e6acdc9e2f984f317ef7f998ee2c79f1a87"

[lib]
doctest = false

[dependencies]
gpui.workspace = true
ropey.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints.rust]
# The macOS accessibility hit-test forwarder and the native text-input bridge
# are Objective-C FFI; each of those two modules lowers this lint itself.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
