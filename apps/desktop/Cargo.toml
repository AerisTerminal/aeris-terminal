[package]
name = "aeris_desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
diagnostics = [
    "aeris_application/test-support",
    "aeris_chart_integration/diagnostics",
    "aeris_platform_runtime/live-gates",
    "dep:sha2",
]

[dependencies]
aeris_application = { path = "../../crates/application" }
aeris_account_runtime = { path = "../../crates/account_runtime" }
aeris_chart_integration = { path = "../../crates/ui/chart_integration" }
aeris_design_system = { path = "../../crates/ui/design_system" }
aeris_instruments = { path = "../../crates/domain/instruments" }
aeris_market_data = { path = "../../crates/domain/market_data" }
aeris_market_runtime = { path = "../../crates/market_runtime" }
aeris_context_runtime = { path = "../../crates/context_runtime" }
aeris_trading = { path = "../../crates/domain/trading" }
aeris_trading_runtime = { path = "../../crates/trading_runtime" }
aeris_study_sdk = { path = "../../crates/study_sdk" }
aeris_contracts = { path = "../../crates/contracts" }
aeris_observability = { path = "../../crates/observability" }
aeris_platform_runtime = { path = "../../crates/platform_runtime" }
aeris_release_lifecycle = { path = "../../crates/release_lifecycle" }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
# Hashes readiness-conformance evidence, which only diagnostics builds and tests compile.
sha2 = { workspace = true, optional = true }
sysinfo.workspace = true
aeris_terminal_ui = { path = "../../crates/ui/terminal_ui" }
chrono.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui_platform.workspace = true
image.workspace = true
num-traits.workspace = true
prost.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
aeris_application = { path = "../../crates/application", features = ["test-support"] }
aeris_chart_integration = { path = "../../crates/ui/chart_integration", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
aeris_platform_runtime = { path = "../../crates/platform_runtime", features = ["live-gates"] }
sha2.workspace = true
aeris_market_runtime = { path = "../../crates/market_runtime", features = ["replay"] }
aeris_trading_runtime = { path = "../../crates/trading_runtime", features = ["test-observability", "test-support"] }

[lints]
workspace = true
