[package]
name = "aeris_terminal_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpui"]
gpui = ["dep:aeris_design_system", "dep:gpui"]

[dependencies]
aeris_instruments = { path = "../../domain/instruments" }
aeris_design_system = { path = "../design_system", optional = true }
aeris_market_data = { path = "../../domain/market_data" }
aeris_trading = { path = "../../domain/trading" }
gpui = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
