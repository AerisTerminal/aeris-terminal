[package]
name = "aeris_chart_integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
diagnostics = []
# `AerisChartView::new` and `Default`, which install the embedded demo replay.
test-support = ["aeris_application/test-support"]

[dependencies]
aeris_application = { path = "../../application" }
aeris_design_system = { path = "../design_system" }
aeris_observability = { path = "../../observability" }
aeris_terminal_ui = { path = "../terminal_ui", default-features = false }
aeris_trading = { path = "../../domain/trading" }
gpui.workspace = true
num-traits = "=0.2.19"
resvg = { version = "=0.48.1", default-features = false }
aeris_charts_engine.workspace = true
aeris_charts_native.workspace = true
aeris_charts_render.workspace = true
aeris_charts_render_gpui.workspace = true
serde_json.workspace = true

[dev-dependencies]
aeris_application = { path = "../../application", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }

[lints]
workspace = true
