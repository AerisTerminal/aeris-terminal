[package]
name = "axiusflow_linux_af_xdp_adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"
publish = false

[features]
default = []
native-copy = ["dep:libxdp-sys", "dep:xsk-rs"]

[dependencies]
axiusflow_transport = { path = "../../transport" }

[target.'cfg(target_os = "linux")'.dependencies]
libxdp-sys = { version = "=0.2.4", features = ["use_cc_build"], optional = true }
xsk-rs = { version = "=0.8.0", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[patch.crates-io]
libxdp-sys = { path = "../../../third_party/libxdp-sys" }
