[package]
name = "axiusflow_linux_af_xdp_adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axiusflow_transport = { path = "../../transport" }

[target.'cfg(target_os = "linux")'.dependencies]
libxdp-sys = { version = "=0.2.4", features = ["use_cc_build"] }
xsk-rs = "=0.8.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
