[package]
name = "aeris_hyperliquid_market_adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aeris_platform_runtime = { path = "../../platform_runtime" }
aeris_market_data = { path = "../../domain/market_data" }
serde.workspace = true
# `raw_value` only exposes the `RawValue` API; it changes no existing
# `serde_json` behavior. The adapter needs it to decode provider decimals
# from raw source text without any `f64` conversion.
serde_json = { workspace = true, features = ["raw_value"] }
ureq.workspace = true

[lints]
workspace = true
