[package]
name = "axiusflow_linux_dpdk_adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"
publish = false
build = "build.rs"

[features]
default = []
native = ["dep:bindgen", "dep:cc"]

[dependencies]
axiusflow_transport = { path = "../../transport" }

[target.'cfg(target_os = "linux")'.build-dependencies]
bindgen = { version = "=0.72.1", optional = true }
cc = { version = "=1.4.0", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
