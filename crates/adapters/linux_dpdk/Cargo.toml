[package]
name = "axiusflow_linux_dpdk_adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
native = ["dep:bindgen", "dep:cc"]

[dependencies]
axiusflow_transport = { path = "../../transport" }

[target.'cfg(target_os = "linux")'.build-dependencies]
bindgen = { version = "=0.72.1", optional = true }
cc = { version = "=1.4.0", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
