[package]
name = "aeris_rithmic_protocol_adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Builds the interactive `provision_rithmic_test` binary, which prompts for a password.
provision = ["dep:rpassword"]

[[bin]]
name = "provision_rithmic_test"
required-features = ["provision"]

[dependencies]
aeris_instruments = { path = "../../domain/instruments" }
aeris_market_data = { path = "../../domain/market_data" }
aeris_observability = { path = "../../observability" }
aeris_platform_runtime = { path = "../../platform_runtime" }
aeris_provider_history = { path = "../../provider_history" }
chrono.workspace = true
prost.workspace = true
rustls.workspace = true
rpassword = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tungstenite.workspace = true
webpki-roots.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
rcgen.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[lints]
workspace = true
