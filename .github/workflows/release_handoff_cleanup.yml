name: Release handoff cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    # Local-only hygiene for interrupted releases. This consumes no
    # GitHub-hosted compute and never has signing or Cloudflare credentials.
    runs-on: [self-hosted, axiusflow, windows, release-build]
    timeout-minutes: 5
    steps:
      - name: Remove abandoned local release handoffs
        shell: pwsh
        run: |
          $root = Join-Path $env:PUBLIC 'AxiusflowReleaseHandoff'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { exit 0 }
          $rootItem = Get-Item -LiteralPath $root -Force -ErrorAction Stop
          if ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "Release handoff root '$root' must not be a reparse point."
          }
          $cutoff = [DateTime]::UtcNow.AddHours(-24)
          Get-ChildItem -LiteralPath $root -Directory -ErrorAction Stop |
            Where-Object {
              $_.Name -match '^\d+-\d+$' -and
              -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and
              $_.LastWriteTimeUtc -lt $cutoff
            } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop }
