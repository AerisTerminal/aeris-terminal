name: Production release

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Monotonic install generation
        required: true
        type: string
      minimum_launcher_version:
        description: Oldest launcher version allowed to install this release
        required: true
        default: "0.2.0"
        type: string
      rollout_cohort:
        description: Signed rollout namespace; keep it stable across percentage promotions
        required: true
        default: "all"
        type: string
      rollout_percentage:
        description: Signed rollout percentage 0..100; each hold/promotion publishes a newer generation
        required: true
        default: "100"
        type: string
      health_gate_approved:
        description: Confirm the release health gate was reviewed and approved for this promotion
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: axiusflow-production-release
  cancel-in-progress: false

jobs:
  qualify-windows:
    # Expensive qualification runs only on the maintainer-owned Windows build
    # runner. It has no production signing or R2 credentials.
    runs-on: [self-hosted, axiusflow, windows, release-build]
    timeout-minutes: 120
    outputs:
      release_sha: ${{ steps.qualified-metadata.outputs.release_sha }}
      release_version: ${{ steps.qualified-metadata.outputs.release_version }}
      release_verifying_key: ${{ steps.qualified-metadata.outputs.release_verifying_key }}
      authenticode_certificate_sha1: ${{ steps.qualified-metadata.outputs.authenticode_certificate_sha1 }}
      authenticode_timestamp_url: ${{ steps.qualified-metadata.outputs.authenticode_timestamp_url }}
      launcher_sha256: ${{ steps.qualified-metadata.outputs.launcher_sha256 }}
      desktop_sha256: ${{ steps.qualified-metadata.outputs.desktop_sha256 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      AUTHENTICODE_CERTIFICATE_SHA1: ${{ vars.AUTHENTICODE_CERTIFICATE_SHA1 }}
      AUTHENTICODE_TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact pushed main revision
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Production releases must be dispatched from refs/heads/main, got '$env:GITHUB_REF'."
          }
          git checkout -B main $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Unable to bind the release checkout to the dispatched commit.' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          try {
            git fetch --no-tags origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh origin/main.' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse origin/main).Trim()
          $branch = (git branch --show-current).Trim()
          $status = (git status --porcelain --untracked-files=normal | Out-String).Trim()
          if ($branch -ne 'main') { throw "Release checkout is not main: '$branch'." }
          if ($head -ne $env:GITHUB_SHA) { throw "Release HEAD $head does not match dispatched commit $env:GITHUB_SHA." }
          if ($head -ne $originMain) { throw "Release HEAD $head does not match origin/main $originMain." }
          if ($status) { throw 'Release checkout is not clean.' }

      - name: Validate release configuration and promotion inputs
        shell: pwsh
        env:
          RELEASE_VERIFYING_KEY_B64URL: ${{ vars.RELEASE_VERIFYING_KEY_B64URL }}
          HEALTH_GATE_APPROVED: ${{ inputs.health_gate_approved }}
          RELEASE_ROLLOUT_COHORT: ${{ inputs.rollout_cohort }}
          RELEASE_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          foreach ($required in @(
              'RELEASE_VERIFYING_KEY_B64URL',
              'AUTHENTICODE_CERTIFICATE_SHA1',
              'AUTHENTICODE_TIMESTAMP_URL'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($required))) {
              throw "Release configuration '$required' is missing."
            }
          }
          if ($env:RELEASE_VERIFYING_KEY_B64URL -notmatch '^[A-Za-z0-9_-]{43}$') {
            throw 'RELEASE_VERIFYING_KEY_B64URL must be the 32-byte Ed25519 public key in base64url form.'
          }
          if ($env:AUTHENTICODE_CERTIFICATE_SHA1 -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'AUTHENTICODE_CERTIFICATE_SHA1 must be a 40-hex certificate thumbprint.'
          }
          if ($env:AUTHENTICODE_TIMESTAMP_URL -notmatch '^https?://[^\s#]+$') {
            throw 'AUTHENTICODE_TIMESTAMP_URL must name an HTTP(S) RFC 3161 endpoint.'
          }
          if ($env:HEALTH_GATE_APPROVED -ne 'true') {
            throw 'Production release promotion requires explicit health-gate approval.'
          }
          if ($env:RELEASE_ROLLOUT_COHORT -notmatch '^[A-Za-z0-9._-]{1,64}$') {
            throw 'Release rollout cohort is invalid.'
          }
          $percentage = 0
          if (-not [int]::TryParse($env:RELEASE_ROLLOUT_PERCENTAGE, [ref]$percentage) -or $percentage -lt 0 -or $percentage -gt 100) {
            throw 'Release rollout percentage must be an integer from 0 through 100.'
          }

      - name: Authenticate private chart dependency
        shell: pwsh
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUCLEUS_CHARTS_TOKEN)) {
            throw 'NUCLEUS_CHARTS_TOKEN is missing.'
          }
          $config = Join-Path $env:RUNNER_TEMP 'axiusflow-release-gitconfig'
          $token = [Uri]::EscapeDataString($env:NUCLEUS_CHARTS_TOKEN)
          $contents = "[url `"https://x-access-token:$token@github.com/`"]`r`n`tinsteadOf = https://github.com/`r`n"
          [IO.File]::WriteAllText($config, $contents, [Text.UTF8Encoding]::new($false))
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_CONFIG_GLOBAL=$config"

      - name: Qualify and prebuild release without publication secrets
        shell: pwsh
        env:
          RELEASE_GENERATION: ${{ inputs.generation }}
          MINIMUM_LAUNCHER_VERSION: ${{ inputs.minimum_launcher_version }}
          RELEASE_ROLLOUT_COHORT: ${{ inputs.rollout_cohort }}
          RELEASE_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
          RELEASE_VERIFYING_KEY_B64URL: ${{ vars.RELEASE_VERIFYING_KEY_B64URL }}
        run: |
          tools/publish_release.ps1 `
            -Generation $env:RELEASE_GENERATION `
            -MinimumLauncherVersion $env:MINIMUM_LAUNCHER_VERSION `
            -AuthenticodeCertificateSha1 $env:AUTHENTICODE_CERTIFICATE_SHA1 `
            -AuthenticodeTimestampUrl $env:AUTHENTICODE_TIMESTAMP_URL `
            -ReleaseVerifyingKey $env:RELEASE_VERIFYING_KEY_B64URL `
            -RolloutCohort $env:RELEASE_ROLLOUT_COHORT `
            -RolloutPercentage ([byte]$env:RELEASE_ROLLOUT_PERCENTAGE) `
            -PrebuildOnly

      - name: Freeze qualified release and stage local handoff
        id: qualified-metadata
        shell: pwsh
        env:
          RELEASE_VERIFYING_KEY_B64URL: ${{ vars.RELEASE_VERIFYING_KEY_B64URL }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve qualified workspace package metadata.' }
          $releasePackages = @($metadata.packages | Where-Object { $_.name -eq 'axiusflow_platform_runtime' })
          if ($releasePackages.Count -ne 1) { throw 'Qualified workspace package identity is ambiguous.' }
          $releaseVersion = [string]$releasePackages[0].version
          if ([string]::IsNullOrWhiteSpace($releaseVersion) -or $releaseVersion -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'Qualified release version is invalid.'
          }
          $launcher = Join-Path $PWD 'target\release\axiusflow_launcher.exe'
          $desktop = Join-Path $PWD 'target\release\axiusflow_desktop.exe'
          foreach ($path in @($launcher, $desktop)) {
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($item.PSIsContainer -or $item.Length -le 0) { throw "Qualified release artifact '$path' is invalid." }
          }
          $launcherHash = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          $desktopHash = (Get-FileHash -LiteralPath $desktop -Algorithm SHA256).Hash.ToLowerInvariant()

          $handoffRoot = Join-Path $env:PUBLIC 'AxiusflowReleaseHandoff'
          if (Test-Path -LiteralPath $handoffRoot) {
            $rootItem = Get-Item -LiteralPath $handoffRoot -Force -ErrorAction Stop
            if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Release handoff root '$handoffRoot' is not a plain directory."
            }
          } else {
            New-Item -ItemType Directory -Path $handoffRoot -ErrorAction Stop | Out-Null
          }
          $cutoff = [DateTime]::UtcNow.AddHours(-24)
          Get-ChildItem -LiteralPath $handoffRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^\d+-\d+$' -and
              -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -and
              $_.LastWriteTimeUtc -lt $cutoff
            } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          $handoff = Join-Path $handoffRoot "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $handoff) { throw "Release handoff already exists at '$handoff'." }
          New-Item -ItemType Directory -Path $handoff | Out-Null
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $handoff 'axiusflow_launcher.exe')
          Copy-Item -LiteralPath $desktop -Destination (Join-Path $handoff 'axiusflow_desktop.exe')

          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_sha=$env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_version=$releaseVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_verifying_key=$env:RELEASE_VERIFYING_KEY_B64URL"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "authenticode_certificate_sha1=$env:AUTHENTICODE_CERTIFICATE_SHA1"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "authenticode_timestamp_url=$env:AUTHENTICODE_TIMESTAMP_URL"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "launcher_sha256=$launcherHash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "desktop_sha256=$desktopHash"

      - name: Remove build-runner release material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'axiusflow-release-gitconfig') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'target\release') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'target\release-publish') -Recurse -Force -ErrorAction SilentlyContinue

  release-windows:
    needs: qualify-windows
    # Same physical PC is allowed, but this label belongs to a distinct Windows
    # runner account that owns the production certificate, local Ed25519 key,
    # protected release tools, and authenticated Wrangler session.
    runs-on: [self-hosted, axiusflow, windows, release-signing]
    timeout-minutes: 60
    env:
      AXIUSFLOW_RELEASE_ENVIRONMENT: self-hosted-release-station
      RELEASE_VERIFYING_KEY_B64URL: ${{ vars.RELEASE_VERIFYING_KEY_B64URL }}
      AUTHENTICODE_CERTIFICATE_SHA1: ${{ vars.AUTHENTICODE_CERTIFICATE_SHA1 }}
      AUTHENTICODE_TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
      AUTHENTICODE_TOOL: ${{ vars.AUTHENTICODE_TOOL || 'signtool.exe' }}
      AUTHENTICODE_TOOL_SHA256: ${{ vars.AUTHENTICODE_TOOL_SHA256 }}
      WRANGLER_PATH: ${{ vars.WRANGLER_PATH || 'wrangler.cmd' }}
      WRANGLER_SHA256: ${{ vars.WRANGLER_SHA256 }}
      ISCC_PATH: ${{ vars.ISCC_PATH || 'ISCC.exe' }}
      ISCC_SHA256: ${{ vars.ISCC_SHA256 }}
      RELEASE_PUBLISHER_PATH: ${{ vars.RELEASE_PUBLISHER_PATH }}
      RELEASE_PUBLISHER_SHA256: ${{ vars.RELEASE_PUBLISHER_SHA256 }}
      RELEASE_SIGNING_KEY_FILE: ${{ vars.RELEASE_SIGNING_KEY_FILE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact pushed main revision
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Production releases must be dispatched from refs/heads/main, got '$env:GITHUB_REF'."
          }
          git checkout -B main $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Unable to bind the release checkout to the dispatched commit.' }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          try {
            git fetch --no-tags origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh origin/main.' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse origin/main).Trim()
          $branch = (git branch --show-current).Trim()
          $status = (git status --porcelain --untracked-files=normal | Out-String).Trim()
          if ($branch -ne 'main') { throw "Release checkout is not main: '$branch'." }
          if ($head -ne $env:GITHUB_SHA) { throw "Release HEAD $head does not match dispatched commit $env:GITHUB_SHA." }
          if ($head -ne $originMain) { throw "Release HEAD $head does not match origin/main $originMain." }
          if ($status) { throw 'Release checkout is not clean.' }

      - name: Restore locally handed-off qualified binaries
        shell: pwsh
        run: |
          $handoffRoot = Join-Path $env:PUBLIC 'AxiusflowReleaseHandoff'
          $rootItem = Get-Item -LiteralPath $handoffRoot -Force -ErrorAction Stop
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "Release handoff root '$handoffRoot' is not a plain directory."
          }
          $handoff = Join-Path $handoffRoot "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (-not (Test-Path -LiteralPath $handoff -PathType Container)) {
            throw "Qualified local handoff is missing at '$handoff'."
          }
          $handoffItem = Get-Item -LiteralPath $handoff -Force -ErrorAction Stop
          if ($handoffItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "Qualified local handoff '$handoff' must not be a reparse point."
          }
          $target = Join-Path $PWD 'target\release'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          foreach ($name in @('axiusflow_launcher.exe', 'axiusflow_desktop.exe')) {
            Copy-Item -LiteralPath (Join-Path $handoff $name) -Destination (Join-Path $target $name)
          }

      - name: Validate qualified artifact set and protected publisher
        shell: pwsh
        env:
          QUALIFIED_RELEASE_SHA: ${{ needs.qualify-windows.outputs.release_sha }}
          QUALIFIED_RELEASE_VERSION: ${{ needs.qualify-windows.outputs.release_version }}
          QUALIFIED_RELEASE_VERIFYING_KEY: ${{ needs.qualify-windows.outputs.release_verifying_key }}
          QUALIFIED_AUTHENTICODE_CERTIFICATE_SHA1: ${{ needs.qualify-windows.outputs.authenticode_certificate_sha1 }}
          QUALIFIED_AUTHENTICODE_TIMESTAMP_URL: ${{ needs.qualify-windows.outputs.authenticode_timestamp_url }}
          EXPECTED_LAUNCHER_SHA256: ${{ needs.qualify-windows.outputs.launcher_sha256 }}
          EXPECTED_DESKTOP_SHA256: ${{ needs.qualify-windows.outputs.desktop_sha256 }}
        run: |
          if ($env:QUALIFIED_RELEASE_SHA -ne $env:GITHUB_SHA) {
            throw "Qualified binaries were built from $env:QUALIFIED_RELEASE_SHA, not dispatched commit $env:GITHUB_SHA."
          }
          if ($env:QUALIFIED_RELEASE_VERIFYING_KEY -ne $env:RELEASE_VERIFYING_KEY_B64URL) {
            throw 'Qualified release verifying key does not match the signer-authoritative repository value.'
          }
          if ($env:QUALIFIED_AUTHENTICODE_CERTIFICATE_SHA1 -ne $env:AUTHENTICODE_CERTIFICATE_SHA1) {
            throw 'Qualified Authenticode certificate does not match the signer-authoritative repository value.'
          }
          if ($env:QUALIFIED_AUTHENTICODE_TIMESTAMP_URL -ne $env:AUTHENTICODE_TIMESTAMP_URL) {
            throw 'Qualified Authenticode timestamp URL does not match the signer-authoritative repository value.'
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve signing-checkout package metadata.' }
          $releasePackages = @($metadata.packages | Where-Object { $_.name -eq 'axiusflow_platform_runtime' })
          if ($releasePackages.Count -ne 1) { throw 'Signing-checkout package identity is ambiguous.' }
          $signingReleaseVersion = [string]$releasePackages[0].version
          if ($env:QUALIFIED_RELEASE_VERSION -ne $signingReleaseVersion) {
            throw "Qualified release version '$env:QUALIFIED_RELEASE_VERSION' does not match signing checkout '$signingReleaseVersion'."
          }
          $expected = @{
            'axiusflow_launcher.exe' = $env:EXPECTED_LAUNCHER_SHA256
            'axiusflow_desktop.exe' = $env:EXPECTED_DESKTOP_SHA256
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $PWD "target\release\$name"
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($item.PSIsContainer -or $item.Length -le 0) { throw "Qualified release artifact '$name' is invalid." }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($expected[$name]) -or $actual -ne $expected[$name]) {
              throw "Qualified release artifact '$name' does not match its GitHub-controlled qualification hash."
            }
          }
          if ($env:RELEASE_PUBLISHER_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'RELEASE_PUBLISHER_SHA256 must be the protected digest of the independently provisioned publisher.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_PUBLISHER_PATH)) {
            throw 'RELEASE_PUBLISHER_PATH must name the independently provisioned publisher.'
          }
          $publisher = Get-Item -LiteralPath $env:RELEASE_PUBLISHER_PATH -ErrorAction Stop
          if ($publisher.PSIsContainer -or $publisher.Length -le 0) { throw 'The independently provisioned release publisher is invalid.' }
          $actualPublisherHash = (Get-FileHash -LiteralPath $publisher.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPublisherHash -ne $env:RELEASE_PUBLISHER_SHA256.ToLowerInvariant()) {
            throw 'The independently provisioned release publisher does not match its protected digest.'
          }

      - name: Validate signing-station tools and certificate
        shell: pwsh
        run: |
          $certificate = Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue |
            Where-Object { $_.Thumbprint -eq $env:AUTHENTICODE_CERTIFICATE_SHA1 -and $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw 'The configured Authenticode certificate with its private key is unavailable to the release-signing account.'
          }
          foreach ($tool in @(
            @{ Name = 'AUTHENTICODE_TOOL'; Path = $env:AUTHENTICODE_TOOL; Hash = $env:AUTHENTICODE_TOOL_SHA256 },
            @{ Name = 'WRANGLER_PATH'; Path = $env:WRANGLER_PATH; Hash = $env:WRANGLER_SHA256 },
            @{ Name = 'ISCC_PATH'; Path = $env:ISCC_PATH; Hash = $env:ISCC_SHA256 }
          )) {
            if ($tool.Hash -notmatch '^[0-9A-Fa-f]{64}$') {
              throw "$($tool.Name)_SHA256 must pin the exact signing-station tool bytes."
            }
            $resolved = if (Test-Path -LiteralPath $tool.Path -PathType Leaf) {
              (Resolve-Path -LiteralPath $tool.Path).Path
            } else {
              $command = Get-Command $tool.Path -ErrorAction SilentlyContinue
              if ($null -eq $command -or [string]::IsNullOrWhiteSpace($command.Source)) {
                throw "Required signing-station tool '$($tool.Path)' is unavailable."
              }
              $command.Source
            }
            $actual = (Get-FileHash -LiteralPath $resolved -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $tool.Hash.ToLowerInvariant()) {
              throw "Signing-station tool '$($tool.Name)' does not match its pinned SHA-256."
            }
            Set-Item -Path "Env:$($tool.Name)" -Value $resolved
            Add-Content -Path $env:GITHUB_ENV -Value "$($tool.Name)=$resolved"
          }

          $signingKey = if ([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_KEY_FILE)) {
            Join-Path $env:LOCALAPPDATA 'Axiusflow\release-signing-key.b64'
          } else {
            [Environment]::ExpandEnvironmentVariables($env:RELEASE_SIGNING_KEY_FILE)
          }
          if (-not (Test-Path -LiteralPath $signingKey -PathType Leaf)) {
            throw "The local Ed25519 release signing key is unavailable at '$signingKey'."
          }
          $keyInfo = Get-Item -LiteralPath $signingKey -ErrorAction Stop
          if ($keyInfo.Length -lt 43 -or $keyInfo.Length -gt 256) {
            throw 'The local Ed25519 release signing key file has an invalid size.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_SIGNING_KEY_FILE=$signingKey"

          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[0-9A-Fa-f]{32}$') {
            throw 'CLOUDFLARE_ACCOUNT_ID must pin the intended Axiusflow Cloudflare account.'
          }
          $whoamiJson = (& $env:WRANGLER_PATH whoami --json | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw 'Wrangler is not authenticated for the local release-signing account.'
          }
          try {
            $whoami = $whoamiJson | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw 'Wrangler account identity output is malformed.'
          }
          $accounts = @($whoami.accounts | Where-Object { $_.id -eq $env:CLOUDFLARE_ACCOUNT_ID })
          if ($whoami.loggedIn -ne $true -or $accounts.Count -ne 1) {
            throw 'Wrangler is not authenticated to the pinned Axiusflow Cloudflare account.'
          }

      - name: Publish qualified signed release
        shell: pwsh
        env:
          RELEASE_GENERATION: ${{ inputs.generation }}
          RELEASE_VERSION: ${{ needs.qualify-windows.outputs.release_version }}
          MINIMUM_LAUNCHER_VERSION: ${{ inputs.minimum_launcher_version }}
          RELEASE_ROLLOUT_COHORT: ${{ inputs.rollout_cohort }}
          RELEASE_ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          foreach ($tool in @(
            @{ Name = 'AUTHENTICODE_TOOL'; Path = $env:AUTHENTICODE_TOOL; Hash = $env:AUTHENTICODE_TOOL_SHA256 },
            @{ Name = 'WRANGLER_PATH'; Path = $env:WRANGLER_PATH; Hash = $env:WRANGLER_SHA256 },
            @{ Name = 'ISCC_PATH'; Path = $env:ISCC_PATH; Hash = $env:ISCC_SHA256 }
          )) {
            $actual = (Get-FileHash -LiteralPath $tool.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $tool.Hash.ToLowerInvariant()) {
              throw "Signing-station tool '$($tool.Name)' changed after validation."
            }
          }
          tools/publish_release.ps1 `
            -Generation $env:RELEASE_GENERATION `
            -ReleaseVersion $env:RELEASE_VERSION `
            -MinimumLauncherVersion $env:MINIMUM_LAUNCHER_VERSION `
            -SigningKeyFile $env:RELEASE_SIGNING_KEY_FILE `
            -AuthenticodeCertificateSha1 $env:AUTHENTICODE_CERTIFICATE_SHA1 `
            -AuthenticodeTimestampUrl $env:AUTHENTICODE_TIMESTAMP_URL `
            -AuthenticodeTool $env:AUTHENTICODE_TOOL `
            -WranglerPath $env:WRANGLER_PATH `
            -IsccPath $env:ISCC_PATH `
            -ReleaseVerifyingKey $env:RELEASE_VERIFYING_KEY_B64URL `
            -RolloutCohort $env:RELEASE_ROLLOUT_COHORT `
            -RolloutPercentage ([byte]$env:RELEASE_ROLLOUT_PERCENTAGE) `
            -SkipQualification `
            -SkipBuild `
            -PublisherPath $env:RELEASE_PUBLISHER_PATH `
            -PublisherSha256 $env:RELEASE_PUBLISHER_SHA256 `
            -Channel stable

      - name: Remove signing-runner release material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $PWD 'target\release') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $PWD 'target\release-publish') -Recurse -Force -ErrorAction SilentlyContinue
          $handoff = Join-Path (Join-Path $env:PUBLIC 'AxiusflowReleaseHandoff') "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item -LiteralPath $handoff -Recurse -Force -ErrorAction SilentlyContinue
