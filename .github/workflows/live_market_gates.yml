name: Live market gates

# The deterministic suite in `ci.yml` proves the rules hold against fixtures.
# Only these jobs prove they hold against a venue, so they run every night and
# publish the result each conformance report reads back.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coinbase:
    # Self-hosted like every other lane: the account carries no paid Actions
    # quota, so GitHub-hosted runners are forbidden.
    runs-on: [self-hosted, axiusflow, linux]
    timeout-minutes: 45
    env:
      # Cargo's built-in git client ignores URL-embedded credentials, so the
      # private chart dependency below must be fetched through the git CLI.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private chart dependency
        # Job-scoped credential rewrite (see ci.yml): per-job temp file via
        # GITHUB_ENV, never the runner owner's persistent global git config.
        run: |
          config="$RUNNER_TEMP/axiusflow-job-gitconfig"
          git config --file "$config" url."https://x-access-token:${{ secrets.NUCLEUS_CHARTS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Validate private chart credential
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          test -n "$NUCLEUS_CHARTS_TOKEN"
          status=$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $NUCLEUS_CHARTS_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/NucleusCharts/financial-charts)
          test "$status" = 200
      - name: Install desktop build libraries
        run: tools/setup_linux_desktop.sh --system
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Soak the live Coinbase feed through the engine
        env:
          AXIUSFLOW_SOAK_SECONDS: "600"
        run: >-
          cargo test -p axiusflow_engine --test live_market_soak --
          --ignored --nocapture live_coinbase_streams_across_timeframe_and_symbol_switches
      - name: Upload the recorded gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-market-gate-coinbase
          path: .cache/evidence/live_market_gate_coinbase.json
          retention-days: 30
      - name: Remove job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/axiusflow-job-gitconfig"

  rithmic:
    # Rithmic needs credentials in the runner's native vault, so this job only
    # runs where they exist. With no matching runner it queues until its
    # timeout and fails closed — a missing gate is reported as "not run",
    # never as a pass.
    runs-on: [self-hosted, rithmic-credentials]
    timeout-minutes: 45
    env:
      # Cargo's built-in git client ignores URL-embedded credentials, so the
      # private chart dependency below must be fetched through the git CLI.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore licensed Rithmic kit
        # The kit is licensed material kept permanently outside Git. A
        # self-hosted credentialed runner keeps a copy at the conventional
        # path (overridable per runner); without it the build silently falls
        # back to kitless Rithmic and no live path can work.
        shell: pwsh
        run: |
          $kitRoot = if ($env:AXIUSFLOW_RITHMIC_KIT_ROOT) { $env:AXIUSFLOW_RITHMIC_KIT_ROOT } else { 'C:\axiusflow-deps\provider-kit' }
          $proto = Join-Path $kitRoot 'proto'
          $dest = Join-Path (Get-Location) 'provider_kit\current\proto'
          if (-not (Test-Path $proto)) {
            Write-Warning "licensed Rithmic kit absent at $proto; continuing kitless"
          } else {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item (Join-Path $proto '*') -Destination $dest -Force
          }
      - name: Authenticate private chart dependency
        # Job-scoped credential rewrite (see ci.yml): per-job temp file via
        # GITHUB_ENV, never the runner owner's persistent global git config.
        # This job assumes a Windows runner, matching its pwsh preflight.
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'axiusflow-job-gitconfig'
          git config --file $config url."https://x-access-token:${{ secrets.NUCLEUS_CHARTS_TOKEN }}@github.com/".insteadOf 'https://github.com/'
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_CONFIG_GLOBAL=$config"
      - name: Validate private chart credential
        shell: pwsh
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUCLEUS_CHARTS_TOKEN)) { throw 'NUCLEUS_CHARTS_TOKEN is empty' }
          $response = Invoke-WebRequest -Uri 'https://api.github.com/repos/NucleusCharts/financial-charts' -Headers @{ Authorization = "Bearer $env:NUCLEUS_CHARTS_TOKEN"; Accept = 'application/vnd.github+json' } -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "private chart credential returned HTTP $($response.StatusCode)" }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Require Rithmic provider kit
        # A kitless build cannot speak R|Protocol: fail here in seconds with
        # an actionable message instead of timing out the soak opaquely.
        shell: pwsh
        run: |
          $schemas = @(Get-ChildItem provider_kit/current/proto/*.proto -ErrorAction SilentlyContinue)
          if ($schemas.Count -eq 0) { throw 'Rithmic provider kit is unavailable on this runner' }
      - name: Soak the live Rithmic feed through the engine
        env:
          AXIUSFLOW_SOAK_SECONDS: "600"
        run: >-
          cargo test -p axiusflow_engine --test live_market_soak --
          --ignored --nocapture live_rithmic_streams_across_timeframe_and_instrument_switches
      - name: Upload the recorded gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-market-gate-rithmic
          path: .cache/evidence/live_market_gate_rithmic.json
          retention-days: 30
      - name: Remove job-scoped git credential
        if: always()
        shell: pwsh
        run: Remove-Item -Force (Join-Path $env:RUNNER_TEMP 'axiusflow-job-gitconfig') -ErrorAction SilentlyContinue
