name: Live market gates

# The deterministic suite in `ci.yml` proves the rules hold against fixtures.
# Only these jobs prove they hold against a venue. Dispatch them after local
# verification, when the maintainer's hardware is available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperliquid:
    # Self-hosted like every other lane: the account carries no paid Actions
    # quota, so GitHub-hosted runners are forbidden. The public feed needs no
    # credentials, so this gate runs on any networked lane hardware.
    runs-on: [self-hosted, axiusflow, linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install desktop build libraries
        run: tools/setup_linux_desktop.sh --system
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Exercise the live Hyperliquid runtime and cancellation path
        run: >-
          cargo test -p aeris_market_runtime --locked --
          --ignored --nocapture live_worker_cancellation_is_prompt
      - name: Upload the recorded gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-market-gate-hyperliquid
          path: .cache/evidence/live_market_gate_hyperliquid.*
          retention-days: 30

  rithmic:
    # Rithmic needs credentials in the runner's native vault, so this job only
    # runs where they exist. With no matching runner it queues until its
    # timeout and fails closed — a missing gate is reported as "not run",
    # never as a pass.
    runs-on: [self-hosted, rithmic-credentials]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore licensed Rithmic kit
        # The kit is licensed material kept permanently outside Git. A
        # self-hosted credentialed runner keeps a copy at the conventional
        # path (overridable per runner); without it the build silently falls
        # back to kitless Rithmic and no live path can work.
        shell: pwsh
        run: |
          $kitRoot = if ($env:AERIS_RITHMIC_KIT_ROOT) {
            $env:AERIS_RITHMIC_KIT_ROOT
          } elseif ($env:AXIUSFLOW_RITHMIC_KIT_ROOT) {
            $env:AXIUSFLOW_RITHMIC_KIT_ROOT
          } else {
            'C:\axiusflow-deps\provider-kit'
          }
          $proto = Join-Path $kitRoot 'proto'
          $dest = Join-Path (Get-Location) 'provider_kit\current\proto'
          if (-not (Test-Path $proto)) {
            Write-Warning "licensed Rithmic kit absent at $proto; continuing kitless"
          } else {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item (Join-Path $proto '*') -Destination $dest -Force
          }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Require Rithmic provider kit
        # A kitless build cannot speak R|Protocol: fail here in seconds with
        # an actionable message instead of timing out the soak opaquely.
        shell: pwsh
        run: |
          $schemas = @(Get-ChildItem provider_kit/current/proto/*.proto -ErrorAction SilentlyContinue)
          if ($schemas.Count -eq 0) { throw 'Rithmic provider kit is unavailable on this runner' }
      - name: Exercise the live Rithmic provider smoke path
        run: >-
          cargo run -p aeris_rithmic_protocol_adapter --bin rithmic_test_smoke --locked --release
      - name: Upload the recorded gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-market-gate-rithmic
          path: .cache/evidence/live_market_gate_rithmic.*
          retention-days: 30
