name: macOS preview build

# Builds an ad-hoc signed Apple Silicon `Aeris Terminal.app` for manual
# testing and keeps it only as a short-lived workflow artifact. It is not a
# release: nothing is published, notarized, or offered to the updater.
# Manual dispatch only, and only while the repository is public, because the
# account carries no paid Actions quota.
#
# A tester build with Rithmic sets `rithmic_kit`: only then does the runner
# unpack the licensed kit from the AERIS_RITHMIC_KIT_TAR_XZ_B64 repository
# secret (a base64 tar.xz of the kit's `proto` folder), and it deletes the kit
# right after the build. The kit itself is never committed or uploaded.
on:
  workflow_dispatch:
    inputs:
      rithmic_kit:
        description: Build with the licensed Rithmic kit (tester builds)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aeris-macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-macos-preview:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      PREVIEW_ROOT: target/macos-preview
      BUNDLE: target/macos-preview/Aeris Terminal.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build without the Rithmic kit
        if: ${{ !inputs.rithmic_kit }}
        run: |
          echo "AERIS_RITHMIC_KIT_DISABLED=1" >> "$GITHUB_ENV"
          echo "PREVIEW_FLAVOR=" >> "$GITHUB_ENV"
      - name: Unpack licensed Rithmic kit
        if: ${{ inputs.rithmic_kit }}
        env:
          RITHMIC_KIT_ARCHIVE: ${{ secrets.AERIS_RITHMIC_KIT_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$RITHMIC_KIT_ARCHIVE" ]; then
            echo "::error::AERIS_RITHMIC_KIT_TAR_XZ_B64 is not set; a Rithmic tester build needs the kit"
            exit 1
          fi
          mkdir -p provider_kit/current
          printf '%s' "$RITHMIC_KIT_ARCHIVE" | base64 --decode | tar -xJf - -C provider_kit/current
          test -f provider_kit/current/proto/change_log
          ls provider_kit/current/proto/*.proto > /dev/null
          echo "PREVIEW_FLAVOR=-rithmic" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build release desktop
        run: cargo build -p aeris_desktop --release --locked
      - name: Delete Rithmic kit and confirm it was compiled in
        if: ${{ always() && inputs.rithmic_kit }}
        run: |
          set -euo pipefail
          rm -rf provider_kit
          # A missing kit falls back to a kitless build silently; fail instead.
          ls target/release/build/aeris_rithmic_protocol_adapter-*/out/rithmic.protobuf.rs
      - name: Assemble app bundle
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p aeris_desktop | cut -d@ -f2)"
          rm -rf "$PREVIEW_ROOT"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp target/release/aeris_desktop "$BUNDLE/Contents/MacOS/aeris_desktop"
          cp apps/desktop/assets/aeris_assets/icons/desktop/macos/aeris.icns "$BUNDLE/Contents/Resources/aeris.icns"
          cp apps/desktop/packaging/macos/Info.plist "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" \
            -c "Set :CFBundleVersion ${{ github.run_number }}" \
            "$BUNDLE/Contents/Info.plist"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          lipo -archs "$BUNDLE/Contents/MacOS/aeris_desktop"
          echo "PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Ad-hoc sign app bundle
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none "$BUNDLE"
          codesign --verify --strict --verbose=2 "$BUNDLE"
          codesign --display --verbose=2 "$BUNDLE"
      - name: Smoke launch app bundle
        run: |
          set -euo pipefail
          log="$PREVIEW_ROOT/smoke-launch.log"
          "$BUNDLE/Contents/MacOS/aeris_desktop" >"$log" 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Aeris Terminal exited during startup"
            cat "$log"
            exit 1
          fi
          screencapture -x "$PREVIEW_ROOT/smoke-launch.png"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          cat "$log"
      # A disk image is one file that survives transfer through Windows and chat
      # apps; opening it mounts a volume the tester runs the app from directly.
      - name: Package app bundle disk image
        run: |
          set -euo pipefail
          stage="$PREVIEW_ROOT/dmg-root"
          image="$PREVIEW_ROOT/Aeris-Terminal-$PREVIEW_VERSION$PREVIEW_FLAVOR-macos-arm64-preview.dmg"
          mount="$PREVIEW_ROOT/dmg-verify"
          mkdir -p "$stage"
          ditto "$BUNDLE" "$stage/Aeris Terminal.app"
          hdiutil create -volname "Aeris Terminal" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$image"
          hdiutil verify "$image"
          mkdir -p "$mount"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          codesign --verify --strict --verbose=2 "$mount/Aeris Terminal.app"
          hdiutil detach "$mount"
          ls -l "$PREVIEW_ROOT"
      - name: Upload app bundle disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeris-terminal${{ env.PREVIEW_FLAVOR }}-macos-arm64-preview
          path: target/macos-preview/Aeris-Terminal-*-macos-arm64-preview.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeris-terminal-macos-smoke-launch
          path: |
            target/macos-preview/smoke-launch.png
            target/macos-preview/smoke-launch.log
          retention-days: 14
