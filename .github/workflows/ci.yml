name: CI

# Deterministic gates run on GitHub-hosted runners: the repository is public,
# so `windows-latest` and `ubuntu-latest` minutes are free, and every push or
# pull request to `main` gets the full local gate without maintainer hardware.
# Hosted runners have no licensed Rithmic provider kit, so kit-gated Rithmic
# code is skipped here (`AERIS_RITHMIC_KIT_DISABLED=1`) and stays local-only.
# Live, credentialed and performance lanes stay manual: `live_market_gates.yml`
# and the macOS workflows are `workflow_dispatch`-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same ref so a fresh push never queues behind
# a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AERIS_RITHMIC_KIT_DISABLED: "1"
  # Keep the hosted-runner disk within limits: no incremental artifacts and
  # line-only debug tables in dev builds.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Check naming and architecture assertions
        run: cargo run -p aeris_naming_check --locked

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test naming and architecture assertions
        run: cargo test -p aeris_naming_check --locked
      - name: Check naming and architecture assertions
        run: cargo run -p aeris_naming_check --locked

  market_performance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Measure market engine baseline
        run: |
          cargo run -p aeris_market_engine --release --example market_data_performance --locked -- "$env:RUNNER_TEMP\market_data_performance.json"
          Get-Content "$env:RUNNER_TEMP\market_data_performance.json"
      - name: Measure offline market coordinator baseline
        run: cargo run -p aeris_market_runtime --release --example coordinator_performance --locked
