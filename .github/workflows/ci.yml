name: CI

# Zero-cost execution policy: lanes run ONLY on maintainer-owned self-hosted
# runners. GitHub-hosted (`*-latest`) runners are forbidden here because the
# account carries no paid Actions quota. Register each runner with the
# `axiusflow` label plus its OS label; a lane with no registered runner
# queues until its timeout and fails closed — never silently green.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One maintainer machine serves the lanes, so a newer push on the same ref
# cancels the older queued run instead of piling up behind it.
concurrency:
  group: axiusflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-linux:
    runs-on: [self-hosted, axiusflow, linux]
    timeout-minutes: 45
    env:
      # Cargo's built-in git client ignores URL-embedded credentials, so the
      # private chart dependency below must be fetched through the git CLI.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private chart dependency
        # Job-scoped credential rewrite: the config lives in a per-job temp
        # file exported via GITHUB_ENV, so it applies to every later cargo
        # fetch yet can never leak into the runner owner's persistent global
        # git configuration (a `--global` rewrite here once broke the owner's
        # own push access until it was removed by hand).
        run: |
          config="$RUNNER_TEMP/axiusflow-job-gitconfig"
          git config --file "$config" url."https://x-access-token:${{ secrets.NUCLEUS_CHARTS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Validate private chart credential
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          test -n "$NUCLEUS_CHARTS_TOKEN"
          status=$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $NUCLEUS_CHARTS_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/NucleusCharts/financial-charts)
          test "$status" = 200
      - name: Install desktop build libraries
        run: tools/setup_linux_desktop.sh --system
      - name: Free runner disk space
        # Best-effort only: the GitHub-hosted lanes needed this because the
        # debug plus release artifacts exceeded default free space. A
        # maintainer-owned runner is sized by its owner, so absent paths or a
        # sudo password prompt must never fail the lane.
        run: |
          sudo -n rm -rf /usr/share/dotnet || true
          sudo -n rm -rf /opt/ghc || true
          sudo -n rm -rf /usr/local/share/boost || true
          sudo -n rm -rf /usr/local/lib/android || true
          sudo -n rm -rf /usr/share/swift || true
          sudo -n apt-get clean || true
          df -h /
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Build release desktop and engine pair
        env:
          AXIUSFLOW_RELEASE_IDENTITY: ${{ github.sha }}
          AXIUSFLOW_INSTALL_GENERATION: ${{ github.run_number }}
        run: cargo build --release -p axiusflow_desktop -p axiusflow_engine --all-features
      - name: Record release pair provenance
        shell: bash
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'generation=%s\n' "$GITHUB_RUN_NUMBER"
            sha256sum target/release/axiusflow_desktop target/release/axiusflow_engine
          } > target/release/release-pair.provenance
      - name: Upload release pair
        uses: actions/upload-artifact@v4
        with:
          name: release-pair-linux
          path: |
            target/release/axiusflow_desktop
            target/release/axiusflow_engine
            target/release/release-pair.provenance
          if-no-files-found: error
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Check local market-data performance
        run: cargo run -p axiusflow_market_data_performance --release -- .cache/evidence/market_data_performance.json 100000
      - name: Upload market-data baseline
        uses: actions/upload-artifact@v4
        with:
            name: market-data-performance-linux
          path: .cache/evidence/market_data_performance.json
          retention-days: 30
      - name: Remove job-scoped git credential
        # The per-job config file carries the chart token: always delete it,
        # even when the lane fails, so no secret lingers in runner temp.
        if: always()
        run: rm -f "$RUNNER_TEMP/axiusflow-job-gitconfig"

  workspace-windows:
    runs-on: [self-hosted, axiusflow, windows]
    timeout-minutes: 60
    env:
      # Cargo's built-in git client ignores URL-embedded credentials, so the
      # private chart dependency below must be fetched through the git CLI.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private chart dependency
        # Job-scoped credential rewrite: the config lives in a per-job temp
        # file exported via GITHUB_ENV, so it applies to every later cargo
        # fetch yet can never leak into the runner owner's persistent global
        # git configuration (a `--global` rewrite here once broke the owner's
        # own push access until it was removed by hand).
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'axiusflow-job-gitconfig'
          git config --file $config url."https://x-access-token:${{ secrets.NUCLEUS_CHARTS_TOKEN }}@github.com/".insteadOf 'https://github.com/'
          Add-Content -Path $env:GITHUB_ENV -Value "GIT_CONFIG_GLOBAL=$config"
      - name: Validate private chart credential
        shell: pwsh
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUCLEUS_CHARTS_TOKEN)) { throw 'NUCLEUS_CHARTS_TOKEN is empty' }
          $response = Invoke-WebRequest -Uri 'https://api.github.com/repos/NucleusCharts/financial-charts' -Headers @{ Authorization = "Bearer $env:NUCLEUS_CHARTS_TOKEN"; Accept = 'application/vnd.github+json' } -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw "private chart credential returned HTTP $($response.StatusCode)" }
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Build release desktop and engine pair
        env:
          AXIUSFLOW_RELEASE_IDENTITY: ${{ github.sha }}
          AXIUSFLOW_INSTALL_GENERATION: ${{ github.run_number }}
        run: cargo build --release -p axiusflow_desktop -p axiusflow_engine --all-features
      - name: Record release pair provenance
        shell: pwsh
        run: |
          $desktop = (Get-FileHash target/release/axiusflow_desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $engine = (Get-FileHash target/release/axiusflow_engine.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "commit=$env:GITHUB_SHA"
            "generation=$env:GITHUB_RUN_NUMBER"
            "$desktop  target/release/axiusflow_desktop.exe"
            "$engine  target/release/axiusflow_engine.exe"
          ) | Set-Content target/release/release-pair.provenance -Encoding utf8NoBOM
      - name: Upload release pair
        uses: actions/upload-artifact@v4
        with:
          name: release-pair-windows
          path: |
            target/release/axiusflow_desktop.exe
            target/release/axiusflow_engine.exe
            target/release/release-pair.provenance
          if-no-files-found: error
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Check local market-data performance
        run: cargo run -p axiusflow_market_data_performance --release -- .cache/evidence/market_data_performance.json 100000
      - name: Upload market-data baseline
        uses: actions/upload-artifact@v4
        with:
            name: market-data-performance-windows
          path: .cache/evidence/market_data_performance.json
          retention-days: 30
      - name: Remove job-scoped git credential
        # The per-job config file carries the chart token: always delete it,
        # even when the lane fails, so no secret lingers in runner temp.
        if: always()
        shell: pwsh
        run: Remove-Item -Force (Join-Path $env:RUNNER_TEMP 'axiusflow-job-gitconfig') -ErrorAction SilentlyContinue

  workspace-macos:
    runs-on: [self-hosted, axiusflow, macos]
    timeout-minutes: 60
    env:
      # Cargo's built-in git client ignores URL-embedded credentials, so the
      # private chart dependency below must be fetched through the git CLI.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private chart dependency
        # Job-scoped credential rewrite: the config lives in a per-job temp
        # file exported via GITHUB_ENV, so it applies to every later cargo
        # fetch yet can never leak into the runner owner's persistent global
        # git configuration (a `--global` rewrite here once broke the owner's
        # own push access until it was removed by hand).
        run: |
          config="$RUNNER_TEMP/axiusflow-job-gitconfig"
          git config --file "$config" url."https://x-access-token:${{ secrets.NUCLEUS_CHARTS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Validate private chart credential
        env:
          NUCLEUS_CHARTS_TOKEN: ${{ secrets.NUCLEUS_CHARTS_TOKEN }}
        run: |
          test -n "$NUCLEUS_CHARTS_TOKEN"
          status=$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $NUCLEUS_CHARTS_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/NucleusCharts/financial-charts)
          test "$status" = 200
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Build release desktop and engine pair
        env:
          AXIUSFLOW_RELEASE_IDENTITY: ${{ github.sha }}
          AXIUSFLOW_INSTALL_GENERATION: ${{ github.run_number }}
        run: cargo build --release -p axiusflow_desktop -p axiusflow_engine --all-features
      - name: Record release pair provenance
        shell: bash
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'generation=%s\n' "$GITHUB_RUN_NUMBER"
            shasum -a 256 target/release/axiusflow_desktop target/release/axiusflow_engine
          } > target/release/release-pair.provenance
      - name: Upload release pair
        uses: actions/upload-artifact@v4
        with:
          name: release-pair-macos
          path: |
            target/release/axiusflow_desktop
            target/release/axiusflow_engine
            target/release/release-pair.provenance
          if-no-files-found: error
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Check local market-data performance
        run: cargo run -p axiusflow_market_data_performance --release -- .cache/evidence/market_data_performance.json 100000
      - name: Upload market-data baseline
        uses: actions/upload-artifact@v4
        with:
            name: market-data-performance-macos
          path: .cache/evidence/market_data_performance.json
          retention-days: 30
      - name: Remove job-scoped git credential
        # The per-job config file carries the chart token: always delete it,
        # even when the lane fails, so no secret lingers in runner temp.
        if: always()
        run: rm -f "$RUNNER_TEMP/axiusflow-job-gitconfig"
