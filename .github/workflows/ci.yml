name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build libraries
        run: tools/setup_linux_desktop.sh --system
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Check local market-data performance
        run: cargo run -p axiusflow_market_data_performance --release -- .cache/evidence/market_data_performance.json 100000
      - name: Upload market-data baseline
        uses: actions/upload-artifact@v4
        with:
          name: market-data-performance-linux
          path: .cache/evidence/market_data_performance.json
          retention-days: 30

  workspace-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Test workspace
        run: cargo test --workspace --all-features

  workspace-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Test workspace
        run: cargo test --workspace --all-features
