name: stage_1_foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace_quality:
    name: workspace_quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install_linux_desktop_build_dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: format
        run: cargo fmt --all -- --check
      - name: workspace_check
        run: cargo check --workspace --all-targets
      - name: workspace_clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: workspace_tests
        run: cargo test --workspace --all-targets
      - name: naming_contract
        run: cargo run --quiet --package axiusflow_naming_check

  portable_matrix:
    name: portable_${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install_linux_desktop_build_dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: portable_contracts_and_real_socket_build
        run: cargo check -p axiusflow_platform_runtime -p axiusflow_transport -p axiusflow_realtime -p axiusflow_observability -p axiusflow_portable_network_adapter -p axiusflow_protocols -p axiusflow_testing
      - name: actual_portable_loopback_packet_partition_fanout_origin
        run: cargo run --quiet --package axiusflow_ingest_conformance -- --evidence-report stage_1_evidence_${{ runner.os }}.json
      - name: retain_stage_1_software_evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage_1_software_evidence_${{ runner.os }}
          path: stage_1_evidence_${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: pinned_gpui_desktop_compile_smoke
        run: cargo check -p axiusflow_desktop --all-targets

  portable_evidence_gate:
    name: portable_cross_platform_evidence_gate
    needs: portable_matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: download_portable_evidence
        uses: actions/download-artifact@v4
        with:
          pattern: stage_1_software_evidence_*
          path: stage_1_evidence
          merge-multiple: true
      - name: verify_cross_platform_evidence
        run: cargo run --quiet --package axiusflow_ingest_conformance -- --verify-evidence-set stage_1_evidence

  linux_profiles:
    name: linux_profile_compile_and_unprivileged_conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install_native_profile_build_dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang llvm make gcc m4 pkg-config libelf-dev zlib1g-dev
      - name: verify_vendored_libxdp_patch_provenance
        run: python3 tools/verify_libxdp_patch.py
      - name: portable_and_contract_profile_builds
        run: cargo check -p axiusflow_linux_socket_network_adapter -p axiusflow_linux_af_xdp_adapter -p axiusflow_linux_dpdk_adapter --all-targets
      - name: isolated_af_xdp_native_copy_build
        env:
          CC: clang
        run: cargo check -p axiusflow_linux_af_xdp_adapter --all-targets --features native-copy
      - name: af_xdp_safe_boundary_fuzz_smoke
        env:
          CC: clang
          AXIUSFLOW_AF_XDP_FUZZ_RUNS: '1024'
        run: tools/run_af_xdp_safe_boundary_fuzz.sh
      - name: tuned_linux_packet_partition_fanout_origin_and_acceleration_gates
        run: cargo run --quiet --package axiusflow_ingest_conformance
      - name: evidence_scope
        run: echo "This unprivileged lane proves tuned Linux loopback packet-to-fenced-partition, bounded direct/durable-tap queues, and Origin host preparation plus explicit AF_XDP/DPDK unavailability; it does not prove external durability, Redpanda, AF_XDP copy/zero-copy, DPDK PMD, hardware, provider, renderer, presentation, or latency readiness."

  af_xdp_copy_veth:
    name: linux_af_xdp_generic_copy_veth_conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify_exact_source_revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: install_af_xdp_build_and_replay_dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang llvm make gcc m4 pkg-config libelf-dev zlib1g-dev iproute2 python3
      - name: build_privileged_conformance_as_runner
        env:
          CC: clang
        run: cargo build --package axiusflow_ingest_conformance --features af-xdp-copy
      - name: configure_veth_pair
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID: -8}"
          echo "RX_IF=axrx${suffix}" >> "$GITHUB_ENV"
          echo "TX_IF=axtx${suffix}" >> "$GITHUB_ENV"
          sudo mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          sudo ip link add "axrx${suffix}" numrxqueues 1 numtxqueues 1 type veth peer name "axtx${suffix}" numrxqueues 1 numtxqueues 1
          sudo ip link set dev "axrx${suffix}" address 02:00:00:00:00:02
          sudo ip link set dev "axtx${suffix}" address 02:00:00:00:00:01
          sudo ip link set "axrx${suffix}" up
          sudo ip link set "axtx${suffix}" up
          sudo sysctl -w "net.ipv6.conf.axrx${suffix}.disable_ipv6=1"
          sudo sysctl -w "net.ipv6.conf.axtx${suffix}.disable_ipv6=1"
      - name: actual_af_xdp_generic_copy_packet_partition_fanout_origin
        shell: bash
        run: |
          set +e
          output="$(sudo --preserve-env=GITHUB_SHA target/debug/axiusflow_ingest_conformance --af-xdp-copy-conformance "$RX_IF" "$TX_IF" stage_1_af_xdp_copy_evidence_Linux.json 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "AF_XDP_COPY_EXERCISED=true" >> "$GITHUB_ENV"
          elif grep -Fq 'initial AF_XDP native lifecycle failed: AF_XDP ingest error: NativeOpen' <<< "$output"; then
            echo "AF_XDP_COPY_EXERCISED=false" >> "$GITHUB_ENV"
            python3 - <<'PY'
          import json
          import os

          evidence = {
              "schema_version": 1,
              "evidence_scope": "stage_1_af_xdp_copy_unavailable",
              "source_revision": os.environ["GITHUB_SHA"],
              "target": {"os": "linux"},
              "profile": "linux_af_xdp",
              "readiness": "implemented",
              "mode": {"active_mode": "unavailable", "zero_copy_verified": False},
              "activation": "native_socket_open_failed_on_github_hosted_runner",
              "claims": {
                  "zero_copy": "not_claimed",
                  "hardware": "not_claimed",
                  "provider": "not_claimed",
                  "production": "not_claimed",
              },
              "limitations": [
                  "privileged_copy_lifecycle_not_exercised",
                  "qualified_host_required",
                  "zero_copy_not_verified",
                  "nic_driver_firmware_unqualified",
                  "no_authorized_packet_feed",
              ],
          }
          with open("stage_1_af_xdp_copy_evidence_Linux.json", "w", encoding="utf-8") as evidence_file:
              json.dump(evidence, evidence_file, indent=2)
              evidence_file.write("\n")
          PY
          else
            exit "$status"
          fi
      - name: verify_af_xdp_copy_evidence_claim_boundary
        if: env.AF_XDP_COPY_EXERCISED == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("stage_1_af_xdp_copy_evidence_Linux.json", encoding="utf-8") as evidence_file:
              evidence = json.load(evidence_file)

          assert evidence["schema_version"] == 1
          assert evidence["evidence_scope"] == "stage_1_af_xdp_copy_conformance"
          assert evidence["source_revision"] == os.environ["GITHUB_SHA"]
          assert evidence["target"]["os"] == "linux"
          assert evidence["profile"] == "linux_af_xdp"
          assert evidence["readiness"] == "implemented"
          assert evidence["mode"] == {
              "active_mode": "af_xdp_copy",
              "generic_skb_mode_forced": True,
              "copy_mode_forced": True,
              "zero_copy_verified": False,
          }
          assert evidence["claims"] == {
              "zero_copy": "not_claimed",
              "hardware": "not_claimed",
              "provider": "not_claimed",
              "production": "not_claimed",
          }
          assert evidence["conformance"]["renderer_submission"] == "not_measured"
          assert evidence["conformance"]["physical_presentation"] == "not_measured"
          assert evidence["generic_corpus_outcomes"] > 0
          assert evidence["generic_corpus_accepted_events"] > 0
          assert evidence["market_bar_corpus_outcomes"] > 0
          assert evidence["market_bar_corpus_accepted_events"] > 0
          PY
      - name: actual_af_xdp_copy_data_path_fuzz
        if: env.AF_XDP_COPY_EXERCISED == 'true'
        shell: bash
        run: |
          sudo ip link set dev "$RX_IF" mtu 9216
          sudo ip link set dev "$TX_IF" mtu 9216
          sudo --preserve-env=GITHUB_SHA target/debug/axiusflow_ingest_conformance --af-xdp-copy-fuzz "$RX_IF" "$TX_IF" 20260802 64 stage_1_af_xdp_copy_fuzz_evidence_Linux.json
      - name: verify_af_xdp_copy_fuzz_evidence_claim_boundary
        if: env.AF_XDP_COPY_EXERCISED == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("stage_1_af_xdp_copy_fuzz_evidence_Linux.json", encoding="utf-8") as evidence_file:
              evidence = json.load(evidence_file)

          assert evidence["schema_version"] == 1
          assert evidence["evidence_scope"] == "stage_1_af_xdp_copy_data_path_fuzz"
          assert evidence["source_revision"] == os.environ["GITHUB_SHA"]
          assert evidence["profile"] == "linux_af_xdp"
          assert evidence["readiness"] == "implemented"
          assert evidence["seed"] == 20260802
          assert evidence["rounds"] == 64
          assert evidence["frames_sent"] > 0
          assert evidence["frames_received"] > 0
          assert evidence["frames_received"] <= evidence["frames_sent"]
          assert evidence["invariants"] == {
              "batch_bound_respected": "passed",
              "frame_size_bound_respected": "passed",
              "overflow_accounting_monotonic": "passed",
              "every_batch_released": "passed",
              "clean_shutdown": "passed",
              "post_exercise_rebind": "passed",
          }
          assert evidence["claims"] == {
              "coverage_guided": "not_claimed",
              "zero_copy": "not_claimed",
              "hardware": "not_claimed",
              "provider": "not_claimed",
              "production": "not_claimed",
          }
          PY
      - name: verify_af_xdp_unavailable_evidence_claim_boundary
        if: env.AF_XDP_COPY_EXERCISED == 'false'
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("stage_1_af_xdp_copy_evidence_Linux.json", encoding="utf-8") as evidence_file:
              evidence = json.load(evidence_file)

          assert evidence["schema_version"] == 1
          assert evidence["evidence_scope"] == "stage_1_af_xdp_copy_unavailable"
          assert evidence["source_revision"] == os.environ["GITHUB_SHA"]
          assert evidence["profile"] == "linux_af_xdp"
          assert evidence["readiness"] == "implemented"
          assert evidence["mode"] == {
              "active_mode": "unavailable",
              "zero_copy_verified": False,
          }
          assert evidence["claims"] == {
              "zero_copy": "not_claimed",
              "hardware": "not_claimed",
              "provider": "not_claimed",
              "production": "not_claimed",
          }
          assert "privileged_copy_lifecycle_not_exercised" in evidence["limitations"]
          PY
      - name: af_xdp_sequential_queue_rebind_regression
        if: env.AF_XDP_COPY_EXERCISED == 'true'
        shell: bash
        env:
          CC: clang
          AXIUSFLOW_AF_XDP_TEST_INTERFACE: ${{ env.RX_IF }}
          AXIUSFLOW_AF_XDP_REQUIRE_PRIVILEGED: '1'
        run: |
          # AXIUSFLOW_AF_XDP_REQUIRE_PRIVILEGED=1 makes a missing interface fail instead of
          # skipping, so this lane cannot silently degrade into a passing no-op.
          # `cargo` is on the runner user's PATH, not root's, so the harness is compiled as the
          # runner and only the resulting binary is executed with elevated privileges.
          cargo test --package axiusflow_linux_af_xdp_adapter --features native-copy \
            --test sequential_rebind --no-run
          test_binary="$(cargo test --package axiusflow_linux_af_xdp_adapter --features native-copy \
            --test sequential_rebind --no-run --message-format=json \
            | python3 -c 'import json, sys; print([record["executable"] for record in map(json.loads, sys.stdin) if record.get("reason") == "compiler-artifact" and record.get("target", {}).get("name") == "sequential_rebind" and record.get("executable")][-1])')"
          test -n "$test_binary" && test -x "$test_binary"
          sudo --preserve-env=AXIUSFLOW_AF_XDP_TEST_INTERFACE,AXIUSFLOW_AF_XDP_REQUIRE_PRIVILEGED,LIBXDP_BPFFS,LIBXDP_BPFFS_AUTOMOUNT \
            "$test_binary" --test-threads=1 --nocapture
      - name: retain_af_xdp_copy_evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage_1_af_xdp_copy_evidence_Linux
          path: |
            stage_1_af_xdp_copy_evidence_Linux.json
            stage_1_af_xdp_copy_fuzz_evidence_Linux.json
          if-no-files-found: error
          retention-days: 30
      - name: cleanup_veth_pair
        if: always()
        shell: bash
        run: sudo ip link delete "$RX_IF" 2>/dev/null || true
      - name: exercised_evidence_scope
        if: env.AF_XDP_COPY_EXERCISED == 'true'
        run: echo "This privileged software lane proves AF_XDP generic/SKB forced-copy veth packet, lifecycle, fenced-partition, bounded fanout, model, Origin, and GPUI-host preparation only; it does not prove zero-copy, qualified hardware, provider connectivity, renderer submission, presentation, or production readiness."
      - name: unavailable_evidence_scope
        if: env.AF_XDP_COPY_EXERCISED == 'false'
        run: echo "This hosted runner could not open the first AF_XDP native socket. The artifact records explicit unavailability; later lifecycle failures remain hard job failures and cannot be reclassified as host unavailability. It proves no copy-mode lifecycle, zero-copy, hardware, provider, renderer, presentation, or production readiness."
