name: stage_1_foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace_quality:
    name: workspace_quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all -- --check
      - name: workspace_check
        run: cargo check --workspace --all-targets
      - name: workspace_clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: naming_contract
        run: cargo run --quiet --package axiusflow_naming_check

  portable_matrix:
    name: portable_${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: portable_contracts_and_real_socket_build
        run: cargo check -p axiusflow_platform_runtime -p axiusflow_transport -p axiusflow_realtime -p axiusflow_observability -p axiusflow_portable_network_adapter -p axiusflow_protocols -p axiusflow_testing
      - name: actual_portable_loopback_packet_partition_fanout_origin
        run: cargo run --quiet --package axiusflow_ingest_conformance -- --evidence-report stage_1_evidence_${{ runner.os }}.json
      - name: retain_stage_1_software_evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage_1_software_evidence_${{ runner.os }}
          path: stage_1_evidence_${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
      - name: pinned_gpui_desktop_compile_smoke
        run: cargo check -p axiusflow_desktop --all-targets

  portable_evidence_gate:
    name: portable_cross_platform_evidence_gate
    needs: portable_matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: download_portable_evidence
        uses: actions/download-artifact@v4
        with:
          pattern: stage_1_software_evidence_*
          path: stage_1_evidence
          merge-multiple: true
      - name: verify_cross_platform_evidence
        run: cargo run --quiet --package axiusflow_ingest_conformance -- --verify-evidence-set stage_1_evidence

  linux_profiles:
    name: linux_profile_compile_and_unprivileged_conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: isolated_profile_builds
        run: cargo check -p axiusflow_linux_socket_network_adapter -p axiusflow_linux_af_xdp_adapter -p axiusflow_linux_dpdk_adapter --all-targets
      - name: tuned_linux_packet_partition_fanout_origin_and_acceleration_gates
        run: cargo run --quiet --package axiusflow_ingest_conformance
      - name: evidence_scope
        run: echo "This unprivileged lane proves tuned Linux loopback packet-to-fenced-partition, bounded direct/durable-tap queues, and Origin host preparation plus explicit AF_XDP/DPDK unavailability; it does not prove external durability, Redpanda, AF_XDP copy/zero-copy, DPDK PMD, hardware, provider, renderer, presentation, or latency readiness."

  af_xdp_copy_veth:
    name: linux_af_xdp_generic_copy_veth_conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify_exact_source_revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: install_af_xdp_build_and_replay_dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang llvm make gcc m4 pkg-config libelf-dev libpcap-dev zlib1g-dev iproute2 tcpreplay
      - name: build_privileged_conformance_as_runner
        env:
          CC: clang
        run: cargo build --package axiusflow_ingest_conformance
      - name: configure_veth_pair
        shell: bash
        run: |
          suffix="${GITHUB_RUN_ID: -8}"
          echo "RX_IF=axrx${suffix}" >> "$GITHUB_ENV"
          echo "TX_IF=axtx${suffix}" >> "$GITHUB_ENV"
          sudo ip link add "axrx${suffix}" type veth peer name "axtx${suffix}"
          sudo ip link set "axrx${suffix}" up
          sudo ip link set "axtx${suffix}" up
      - name: actual_af_xdp_generic_copy_packet_partition_fanout_origin
        run: sudo --preserve-env=GITHUB_SHA target/debug/axiusflow_ingest_conformance --af-xdp-copy-conformance "$RX_IF" "$TX_IF" stage_1_af_xdp_copy_evidence_Linux.json
      - name: verify_af_xdp_copy_evidence_claim_boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("stage_1_af_xdp_copy_evidence_Linux.json", encoding="utf-8") as evidence_file:
              evidence = json.load(evidence_file)

          assert evidence["schema_version"] == 1
          assert evidence["evidence_scope"] == "stage_1_af_xdp_copy_conformance"
          assert evidence["source_revision"] == os.environ["GITHUB_SHA"]
          assert evidence["target"]["os"] == "linux"
          assert evidence["profile"] == "linux_af_xdp"
          assert evidence["readiness"] == "implemented"
          assert evidence["mode"] == {
              "active_mode": "af_xdp_copy",
              "generic_skb_mode_forced": True,
              "copy_mode_forced": True,
              "zero_copy_verified": False,
          }
          assert evidence["claims"] == {
              "zero_copy": "not_claimed",
              "hardware": "not_claimed",
              "provider": "not_claimed",
              "production": "not_claimed",
          }
          assert evidence["conformance"]["renderer_submission"] == "not_measured"
          assert evidence["conformance"]["physical_presentation"] == "not_measured"
          assert evidence["generic_corpus_outcomes"] > 0
          assert evidence["generic_corpus_accepted_events"] > 0
          assert evidence["market_bar_corpus_outcomes"] > 0
          assert evidence["market_bar_corpus_accepted_events"] > 0
          PY
      - name: retain_af_xdp_copy_evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage_1_af_xdp_copy_evidence_Linux
          path: stage_1_af_xdp_copy_evidence_Linux.json
          if-no-files-found: error
          retention-days: 30
      - name: cleanup_veth_pair
        if: always()
        shell: bash
        run: sudo ip link delete "$RX_IF" 2>/dev/null || true
      - name: evidence_scope
        run: echo "This privileged software lane proves AF_XDP generic/SKB forced-copy veth packet, lifecycle, fenced-partition, bounded fanout, model, Origin, and GPUI-host preparation only; it does not prove zero-copy, qualified hardware, provider connectivity, renderer submission, presentation, or production readiness."
