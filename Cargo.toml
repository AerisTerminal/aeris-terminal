[workspace]
members = [
    "apps/desktop",
    "crates/adapters/linux_af_xdp",
    "crates/adapters/linux_dpdk",
    "crates/adapters/linux_socket_network",
    "crates/adapters/macos_network",
    "crates/adapters/market_protocol",
    "crates/adapters/portable_network",
    "crates/adapters/stream_websocket",
    "crates/adapters/windows_network",
    "crates/application",
    "crates/domain/authorization",
    "crates/domain/instruments",
    "crates/domain/market_data",
    "crates/observability",
    "crates/persistence",
    "crates/platform_runtime",
    "crates/protocols",
    "crates/realtime",
    "crates/security",
    "crates/testing",
    "crates/transport",
    "crates/ui/chart_integration",
    "crates/ui/design_system",
    "crates/ui/terminal_ui",
    "services/authorization_service",
    "tools/ingest_conformance",
    "tools/naming_check",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
core_affinity = "=0.8.3"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
jsonwebtoken = { version = "=11.0.0", default-features = false }
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thread-priority = "=3.1.1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704", version = "=0.5.2" }
origin_engine = { git = "https://github.com/TradeAion/Origin_charts.git", rev = "8753b071aed2f01ae6c61ad9fbc2a4d4a0506531", version = "=0.1.0" }
origin_render = { git = "https://github.com/TradeAion/Origin_charts.git", rev = "8753b071aed2f01ae6c61ad9fbc2a4d4a0506531", version = "=0.1.0" }
origin_render_gpui = { git = "https://github.com/TradeAion/Origin_charts.git", rev = "8753b071aed2f01ae6c61ad9fbc2a4d4a0506531", version = "=0.1.0", features = ["gpui-backend"] }

[patch.crates-io]
# Origin pins the published `gpui = 0.2.2`; replace it with the same Git source
# used by GPUI Component. Cargo.lock records the immutable Zed commit.
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
# libxdp 1.6.0 leaks its AF_XDP program refcount-map descriptor during normal
# socket deletion. Keep the exact crate source local with the upstream cleanup
# corrected until a released libxdp-sys version contains the fix.
libxdp-sys = { path = "third_party/libxdp-sys" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
