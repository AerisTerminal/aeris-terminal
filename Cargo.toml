[workspace]
members = [
    "apps/desktop",
    "crates/adapters/rithmic_protocol",
    "crates/adapters/hyperliquid_market",
    "crates/application",
    "crates/account_runtime",
    "crates/market_engine",
    "crates/market_runtime",
    "crates/trading_runtime",
    "crates/study_sdk",
    "crates/domain/account",
    "crates/domain/instruments",
    "crates/domain/market_data",
    "crates/domain/trading",
    "crates/contracts",
    "crates/observability",
    "crates/platform_runtime",
    "crates/provider_history",
    "crates/ui/chart_integration",
    "crates/ui/design_system",
    "crates/ui/terminal_ui",
    "tools/naming_check",
]
exclude = ["third_party/gpui_base"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
publish = false
rust-version = "1.98.1"
version = "0.2.3"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
display-info = "=0.5.9"
embed-resource = "=3.0.11"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
notify-rust = "=4.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
rustls = "=0.23.44"
serde_json = "=1.0.151"
semver = "=1.0.28"
same-file = "=1.0.6"
webpki-roots = "=1.0.9"
sha2 = "=0.11.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
wayland-client = { version = "=0.31.15", default-features = false, features = ["dlopen"] }
wayland-protocols = { version = "=0.32.13", default-features = false, features = [
    "client",
    "unstable",
] }
windows-sys = { version = "=0.61.2", default-features = false }
tungstenite = { version = "=0.30.0", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }
unicode-segmentation = "=1.13.3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = { version = "=1.9.0", default-features = false }
prost = "=0.14.4"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rpassword = "=7.5.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
gpui-base = { path = "third_party/gpui_base" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6", version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6", default-features = false, features = ["wayland", "x11"] }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6", version = "=0.1.0" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
aeris_charts_engine = { git = "https://github.com/AerisTerminal/aeris-charts.git", rev = "4c6d44d48060c5b8f5bc8e63ab14edbd82be233e", version = "=0.3.0" }
aeris_charts_indicators = { git = "https://github.com/AerisTerminal/aeris-charts.git", rev = "4c6d44d48060c5b8f5bc8e63ab14edbd82be233e", version = "=0.3.0" }
aeris_charts_render = { git = "https://github.com/AerisTerminal/aeris-charts.git", rev = "4c6d44d48060c5b8f5bc8e63ab14edbd82be233e", version = "=0.3.0" }
aeris_charts_render_gpui = { git = "https://github.com/AerisTerminal/aeris-charts.git", rev = "4c6d44d48060c5b8f5bc8e63ab14edbd82be233e", version = "=0.3.0", features = ["gpui-backend"] }

[patch.crates-io]
# Aeris Charts pins the published `gpui = 0.2.2`; replace it with the exact same reviewed Git
# revision used by the desktop so GPUI types cannot split across sources.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6", version = "=0.2.2" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
