[workspace]
members = [
    "apps/engine",
    "apps/desktop",
    "crates/adapters/coinbase_market",
    "crates/adapters/rithmic_protocol",
    "crates/application",
    "crates/market_engine",
    "crates/domain/instruments",
    "crates/domain/market_data",
    "crates/local_storage",
    "crates/local_history",
    "crates/engine_protocol",
    "crates/local_engine_client",
    "crates/observability",
    "crates/platform_runtime",
    "crates/provider_history",
    "crates/transport",
    "crates/ui/chart_integration",
    "crates/ui/design_system",
    "crates/ui/terminal_ui",
    "tools/diagnostics_overhead",
    "tools/market_data_performance",
    "tools/naming_check",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
publish = false
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
display-info = "=0.5.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = "=0.4.3"
interprocess = { version = "=2.4.3", default-features = false }
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
rustls = "=0.23.43"
serde_json = "=1.0.151"
semver = "=1.0.28"
webpki-roots = "=1.0.9"
sha2 = "=0.10.9"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
wayland-client = { version = "=0.31.15", default-features = false, features = ["dlopen"] }
wayland-protocols = { version = "=0.32.13", default-features = false, features = [
    "client",
    "unstable",
] }
windows-sys = { version = "=0.61.2", default-features = false }
tungstenite = { version = "=0.30.0", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
] }
unicode-segmentation = "=1.13.3"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls", "json"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = { version = "=1.9.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
prost = "=0.14.4"
rcgen = { version = "=0.14.9", default-features = false, features = ["ring"] }
rpassword = "=7.5.4"
hmac = "=0.12.1"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
gpui = { git = "https://github.com/zed-industries/zed", rev = "a66fb6aebdee68ee5ae7d191d9dff0d61a42b834", version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a66fb6aebdee68ee5ae7d191d9dff0d61a42b834", default-features = false, features = ["wayland", "x11"] }
nucleuscharts_engine = { git = "https://github.com/NucleusCharts/financial-charts.git", rev = "6a3ac948be93cae0a8b712a493fc73f9291a2b69", version = "=0.1.0" }
nucleuscharts_render = { git = "https://github.com/NucleusCharts/financial-charts.git", rev = "6a3ac948be93cae0a8b712a493fc73f9291a2b69", version = "=0.1.0" }
nucleuscharts_render_gpui = { git = "https://github.com/NucleusCharts/financial-charts.git", rev = "6a3ac948be93cae0a8b712a493fc73f9291a2b69", version = "=0.1.0", features = ["gpui-backend"] }

[patch.crates-io]
# Nucleus Charts pins the published `gpui = 0.2.2`; replace it with the exact same reviewed Git
# revision used by the desktop so GPUI types cannot split across sources.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a66fb6aebdee68ee5ae7d191d9dff0d61a42b834", version = "=0.2.2" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
