syntax = "proto3";

package axiusflow.common.v1;

// Shared metadata required on every durable Axiusflow domain event.
message EventMetadata {
  string event_id = 1;
  int64 event_time_unix_nanos = 2;
  int64 publication_time_unix_nanos = 3;
  string producer = 4;
  uint32 schema_version = 5;
  string correlation_id = 6;
  string causation_id = 7;
  uint32 partition_id = 8;
  uint64 ownership_epoch = 9;
}

// Fixed-point wire value. Mantissa uses signed, big-endian two's-complement.
message DecimalValue {
  bytes mantissa = 1;
  uint32 scale = 2;
  string unit = 3;
}
