syntax = "proto3";

package axiusflow.market.v1;

import "axiusflow/common/v1/event_envelope.proto";
import "axiusflow/instrument/v1/instrument.proto";

// Delivery semantics attached to every canonical market event.
enum SemanticClass {
  SEMANTIC_CLASS_UNSPECIFIED = 0;
  SEMANTIC_CLASS_STATE_REPLACE = 1;
  SEMANTIC_CLASS_ORDERED_DELTA = 2;
  SEMANTIC_CLASS_RELIABLE_EVENT = 3;
  SEMANTIC_CLASS_AUTHORITATIVE_EVENT = 4;
  SEMANTIC_CLASS_SNAPSHOT = 5;
}

// Clock source for an optional NIC/driver receive timestamp.
enum TimestampSource {
  TIMESTAMP_SOURCE_UNSPECIFIED = 0;
  TIMESTAMP_SOURCE_SOCKET_SOFTWARE = 1;
  TIMESTAMP_SOURCE_KERNEL_SOFTWARE = 2;
  TIMESTAMP_SOURCE_NIC_HARDWARE = 3;
  TIMESTAMP_SOURCE_PROVIDER = 4;
}

// Provenance and ordering fields preserved by every canonical market event.
message MarketEventHeader {
  axiusflow.common.v1.EventMetadata metadata = 1;
  string instrument_id = 2;
  uint64 instrument_revision = 3;
  string venue_id = 4;
  string source_id = 5;
  uint64 source_sequence = 6;
  int64 exchange_timestamp_unix_nanos = 7;
  int64 provider_receive_timestamp_unix_nanos = 8;
  int64 axiusflow_receive_timestamp_unix_nanos = 9;
  int64 publication_timestamp_unix_nanos = 10;
  uint64 correction_flags = 11;
  uint64 quality_flags = 12;
  reserved 13;
  uint64 session_generation = 14;
  optional int64 nic_receive_timestamp_unix_nanos = 15;
  int64 normalized_timestamp_unix_nanos = 16;
  TimestampSource nic_timestamp_source = 17;
  SemanticClass semantic_class = 18;
  string entitlement_revision = 19;
  optional int64 fanout_enqueue_timestamp_unix_nanos = 20;
}

// One deterministic fixed-point OHLCV bar for a versioned definition.
message MarketBar {
  MarketEventHeader header = 1;
  uint32 interval_seconds = 2;
  axiusflow.common.v1.DecimalValue open = 3;
  axiusflow.common.v1.DecimalValue high = 4;
  axiusflow.common.v1.DecimalValue low = 5;
  axiusflow.common.v1.DecimalValue close = 6;
  axiusflow.common.v1.DecimalValue volume = 7;
  string bar_definition_id = 8;
  uint32 bar_definition_version = 9;
}

// Initial bounded state for one client subscription.
message MarketBarSnapshot {
  string subscription_id = 1;
  axiusflow.instrument.v1.InstrumentRevision instrument = 2;
  repeated MarketBar bars = 3;
  uint64 first_sequence = 4;
  uint64 last_sequence = 5;
  reserved 6;
  uint64 session_generation = 7;
  uint64 publication_generation = 8;
  bytes checksum = 9;
  uint32 schema_version = 10;

  // Optional bounded chunk metadata. A zero chunk_count denotes the complete
  // single-message form above; chunked snapshots use a nonempty snapshot_id,
  // zero-based contiguous indexes, and repeat all whole-snapshot evidence.
  string snapshot_id = 11;
  uint32 chunk_index = 12;
  uint32 chunk_count = 13;
  uint32 total_item_count = 14;
}

// One ordered update following a previously accepted sequence.
message MarketBarDelta {
  string subscription_id = 1;
  uint64 previous_sequence = 2;
  MarketBar bar = 3;
}

// Client stream messages begin with a snapshot and continue with deltas.
message MarketBarStreamEnvelope {
  oneof update {
    MarketBarSnapshot snapshot = 1;
    MarketBarDelta delta = 2;
  }
}
