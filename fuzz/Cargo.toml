[package]
name = "axiusflow_fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
axiusflow_linux_af_xdp_adapter = { path = "../crates/adapters/linux_af_xdp", features = ["native-copy"] }
axiusflow_transport = { path = "../crates/transport" }

[[bin]]
name = "af_xdp_safe_boundary"
path = "fuzz_targets/af_xdp_safe_boundary.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
