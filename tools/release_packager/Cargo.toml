[package]
name = "aeris_release_packager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aeris_release_packager"
path = "src/lib.rs"

[[bin]]
name = "aeris_release_packager"
path = "src/main.rs"

# The installed desktop and launcher of the `lifecycle_e2e` releases; never packaged for users.
[[bin]]
name = "aeris_lifecycle_fixture"
path = "src/bin/aeris_lifecycle_fixture.rs"
test = false
doc = false

[dependencies]
aeris_platform_runtime = { path = "../../crates/platform_runtime" }
aeris_release_lifecycle = { path = "../../crates/release_lifecycle", features = ["producer"] }
aeris_trading_runtime = { path = "../../crates/trading_runtime" }
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
