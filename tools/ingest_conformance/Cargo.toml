     [package]
name = "axiusflow_ingest_conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
af-xdp-copy = ["axiusflow_linux_af_xdp_adapter/native-copy"]
dpdk-native = ["axiusflow_linux_dpdk_adapter/native"]
redpanda = ["axiusflow_streaming/redpanda"]
quic = ["dep:quinn", "dep:rcgen", "dep:tokio"]

[dependencies]
axiusflow_application = { path = "../../crates/application" }
axiusflow_linux_af_xdp_adapter = { path = "../../crates/adapters/linux_af_xdp" }
axiusflow_linux_dpdk_adapter = { path = "../../crates/adapters/linux_dpdk" }
axiusflow_linux_socket_network_adapter = { path = "../../crates/adapters/linux_socket_network" }
axiusflow_macos_network_adapter = { path = "../../crates/adapters/macos_network" }
axiusflow_observability = { path = "../../crates/observability" }
axiusflow_market_protocol_adapter = { path = "../../crates/adapters/market_protocol" }
axiusflow_persistence = { path = "../../crates/persistence" }
axiusflow_protocols = { path = "../../crates/protocols" }
axiusflow_portable_network_adapter = { path = "../../crates/adapters/portable_network" }
axiusflow_realtime = { path = "../../crates/realtime" }
axiusflow_security = { path = "../../crates/security" }
axiusflow_streaming = { path = "../../crates/streaming" }
axiusflow_testing = { path = "../../crates/testing" }
axiusflow_chart_integration = { path = "../../crates/ui/chart_integration" }
axiusflow_coinbase_market_adapter = { path = "../../crates/adapters/coinbase_market" }
axiusflow_transport = { path = "../../crates/transport" }
axiusflow_windows_network_adapter = { path = "../../crates/adapters/windows_network" }
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
postgres.workspace = true
redb.workspace = true
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, optional = true }
tungstenite.workspace = true

[lints]
workspace = true
